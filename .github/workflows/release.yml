name: Release Build
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python - <<'PY'
          import os, tomllib
          version=tomllib.load(open('pyproject.toml','rb'))['project']['version']
          tag=os.environ['GITHUB_REF_NAME']
          accepted={'v'+version, 'v'+version.replace('rc','-rc.')}
          assert tag in accepted, f'tag {tag!r} does not match package version {version!r}'
          PY
      - run: python -m pip install -U pip pytest build
      - run: python -m pip install -e .
      - run: pytest -q
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: blc-reverselab --help
      - name: Generate SHA-256 checksums
        shell: bash
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: BLCReverseLab-python-package
          path: dist/*
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          extra=""
          if [[ "$GITHUB_REF_NAME" == *"-rc."* ]]; then extra="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $extra
