name: Publish 1.1 Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.1.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create v1.1.0 at the validated product commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          TAG=v1.1.0
          TARGET_SHA="$(git rev-parse HEAD^)"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            existing="$(git rev-list -n1 "$TAG")"
            [[ "$existing" == "$TARGET_SHA" ]] || { echo "$TAG already exists at $existing" >&2; exit 1; }
          else
            git tag "$TAG" "$TARGET_SHA"
            git push origin "refs/tags/$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git checkout --detach "$TARGET_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify version
        run: |
          python - <<'PY'
          import tomllib
          assert tomllib.load(open('pyproject.toml','rb'))['project']['version'] == '1.1.0'
          PY
      - run: python -m pip install -U pip pytest build
      - run: python -m pip install -e .
      - run: pytest -q
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: blc-reverselab --help
      - name: Generate SHA-256 checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: BLCReverseLab-v1.1.0
          path: dist/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
          fi
