name: Publish 1.0 Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve or create v1.0.0 tag
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG=v1.0.0
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TARGET_SHA="$(git rev-list -n1 "$TAG")"
          else
            TARGET_SHA="$GITHUB_SHA"
            git tag "$TAG" "$TARGET_SHA"
            git push origin "refs/tags/$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          git checkout --detach "$TARGET_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify stable package version
        shell: bash
        run: |
          python - <<'PY'
          import tomllib
          version = tomllib.load(open('pyproject.toml','rb'))['project']['version']
          assert version == '1.0.0', version
          PY

      - run: python -m pip install -U pip pytest build
      - run: python -m pip install -e .
      - run: pytest -q
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: blc-reverselab --help

      - name: Generate SHA-256 checksums
        shell: bash
        run: sha256sum dist/* > dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: BLCReverseLab-v1.0.0
          path: dist/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
          fi
