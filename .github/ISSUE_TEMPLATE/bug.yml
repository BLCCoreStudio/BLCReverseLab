name: Bug report
description: Report a reproducible BLCReverseLab defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload proprietary binaries, credentials, secrets, or exploit material against systems you do not control.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: 1.0.0rc1 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, Windows, macOS, Other]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Prefer synthetic/redistributable fixtures and sanitized logs.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Relevant doctor output, adapter status, or sanitized log tail.
  - type: checkboxes
    id: scope
    attributes:
      label: Authorized scope
      options:
        - label: The report does not request anti-cheat bypass, stealth/evasion, credential theft, integrity-bypass automation, or online-cheating automation.
          required: true
