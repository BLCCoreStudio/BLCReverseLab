[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blc-reverselab"
version = "0.3.0a1"
description = "Evidence-first reverse engineering workspace for authorized analysis."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "BLCCoreStudio"}]
dependencies = []

[project.scripts]
blc-reverselab = "blc_reverselab.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
